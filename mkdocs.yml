site_name: TopicJev
site_description: An Efficient Low-Resource Bootstrap for Topic Model Refinement in Zero-Shot Settings
site_author: Mason Smetana, Igor Sukharev, Lev Khazanovich
site_url: https://anatems1.github.io/TopicJev/
repo_url: https://github.com/anatems1/TopicJev
repo_name: anatems1/TopicJev
edit_uri: edit/master/docs/src/
copyright: Copyright &copy; 2026 TopicJev authors &middot; MIT License

# Markdown sources live in docs/src; the built site goes to docs/html.
# (MkDocs refuses a site_dir inside docs_dir, so the two are siblings.)
docs_dir: docs/src
site_dir: docs/html
# page.html instead of page/index.html: the built site also works opened from disk
use_directory_urls: false

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting_started/installation.md
      - Quick Start: getting_started/quickstart.md
      - Zero-shot Classification: getting_started/entailment.md
      - Compression: getting_started/compression.md
      - Embeddings: getting_started/embeddings.md
      - LLM Generation: getting_started/generation.md
      - Prompt Templates: getting_started/prompts.md
      - Hardware and Memory: getting_started/devices.md
  - Examples:
      - BERTopic + Laya: examples/bertopic_laya.md
      - KMeans + LLM Labels + Laya: examples/kmeans_genlbs_laya.md
  - How It Works: algorithm.md
  - FAQ: faq.md
  - API:
      - topicjev.entail: api/entail.md
      - topicjev.compress: api/compress.md
      - topicjev.gen: api/gen.md
      - topicjev.prompts: api/prompts.md
      - topicjev.backend: api/backend.md
  - Changelog: changelog.md
  - Contributing: contributing.md

theme:
  name: material
  logo: img/logo.png
  favicon: img/logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/anatems1/TopicJev

plugins:
  - search
  # makes search and the theme toggle work when docs/html is opened from disk (file://)
  - offline
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_root_heading: true
            show_root_full_path: false
            show_bases: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            filters: ["!^_"]

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
